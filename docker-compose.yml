services:
  mastablasta:
    build: .
    container_name: mastablasta-api
    # Note: network_mode: host only works on Linux hosts. 
    # On Windows/macOS, use ports mapping instead:
    # ports:
    #   - "33766:33766"
    # And update DATABASE_URL to use host.docker.internal
    network_mode: host
    env_file:
      - .env
    environment:
      - PORT=33766
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:33766/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s